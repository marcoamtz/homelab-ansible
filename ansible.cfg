[defaults]
inventory = inventory.ini
retry_files_enabled = false
vault_password_file = ~/.ansible/vault_password
roles_path = ./roles

# Gather facts once per host per run, cache for a day — the asserts and
# deb822 repo setup need ansible_os_family / ansible_distribution_release.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible/facts
fact_caching_timeout = 86400

# Per-task timing summary (plugin lives in ansible.posix).
callbacks_enabled = ansible.posix.profile_tasks
# YAML-formatted results from the built-in default callback. (The standalone
# `yaml` stdout callback is deprecated in community.general.)
callback_result_format = yaml
