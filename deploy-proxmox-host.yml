---
- name: Deploy Proxmox Host Configuration
  hosts: proxmox_hosts
  become: yes

  tasks:
    # GPU passthrough for unprivileged LXC containers requires world-readable
    # /dev/dri devices. Without this, the UID mapping makes the render device
    # inaccessible inside the container.
    - name: Deploy GPU passthrough udev rule
      copy:
        content: 'SUBSYSTEM=="drm", MODE="0666"'
        dest: /etc/udev/rules.d/99-gpu-passthrough.rules
        owner: root
        group: root
        mode: "0644"
      notify: Reload udev rules

    - name: Set GPU device permissions
      file:
        path: /dev/dri/renderD128
        mode: "0666"

    - name: Enable weekly TRIM for OS drive
      command: systemctl enable --now fstrim.timer
      register: fstrim_result
      changed_when: "'Created symlink' in fstrim_result.stderr"

    - name: Enable weekly TRIM for ZFS tank pool
      command: systemctl enable --now zfs-trim-weekly@tank.timer
      register: zfs_trim_result
      changed_when: "'Created symlink' in zfs_trim_result.stderr"

    # --- LXC pre-start NFS wait ---
    - name: Ensure Proxmox snippets directory exists
      file:
        path: /var/lib/vz/snippets
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy LXC pre-start NFS wait hook
      template:
        src: proxmox/wait-for-nfs.sh.j2
        dest: /var/lib/vz/snippets/wait-for-nfs.sh
        owner: root
        group: root
        mode: "0755"

    - name: Wire pre-start NFS wait hook on LXCs
      command: "pct set {{ item.key }} --hookscript local:snippets/wait-for-nfs.sh"
      loop: "{{ lxc_pre_start_nfs_waits | dict2items }}"
      loop_control:
        label: "CT {{ item.key }}"
      register: pct_hookscript_result
      changed_when: false  # pct set is config-level idempotent; no diff signal

  handlers:
    - name: Reload udev rules
      shell: udevadm control --reload-rules && udevadm trigger --subsystem-match=drm
      changed_when: false
