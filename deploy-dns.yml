---
- name: Deploy NextDNS and Dnsmasq (LXC Optimized)
  hosts: dns_servers
  become: true

  roles:
    - role: common
      vars:
        common_extra_packages: [dnsmasq, debian-archive-keyring, dnsutils]
        common_manage_locale: false
        common_enable_msmtp: true  # check-ipv6-dns.sh pipes alerts to msmtp
    - dns_server
