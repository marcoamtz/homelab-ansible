---
name: Lint

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # ansible.cfg points at ~/.ansible/vault_password; no vaulted data is
      # committed, so syntax checks only need the file to exist.
      - name: Provide dummy vault password
        run: |
          echo ci-dummy > "$RUNNER_TEMP/vault_password"
          echo "ANSIBLE_VAULT_PASSWORD_FILE=$RUNNER_TEMP/vault_password" >> "$GITHUB_ENV"
      # Same hooks as local commits: yamllint, ansible-lint, whitespace.
      # Inlined from pre-commit/action (unmaintained, pins Node 20 cache@v4).
      - run: python -m pip install pre-commit
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pre-commit run --show-diff-on-failure --color=always --all-files
