---
# No reboot handling on purpose — LXC containers share the host kernel, so
# dist-upgrade inside a container never requires a container reboot.
- name: Update all LXC containers
  hosts: lxc_containers
  become: true

  pre_tasks:
    - name: Configure apt package caching
      ansible.builtin.import_role:
        name: common
        tasks_from: apt_cache

  tasks:
    - name: Update and upgrade packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
      register: apt_result

    - name: Show upgraded packages  # noqa: no-handler
      ansible.builtin.debug:
        msg: "{{ apt_result.stdout_lines | default([]) }}"
      when: apt_result is changed

    - name: Remove obsolete packages
      ansible.builtin.apt:
        autoremove: true
        purge: true
      tags: [cleanup]
