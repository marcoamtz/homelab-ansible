---
# Hard fail when a bind mount is missing — starting stacks without them would
# write container data into empty directories on the LXC root disk.
- name: Verify required bind mounts are active
  ansible.builtin.command: findmnt --noheadings {{ item }}
  register: mount_check
  changed_when: false
  loop:
    - "{{ nas_media_path }}"
    - "{{ nas_complete_path }}"
    - "{{ docker_tank_mount }}"
  tags: [always]

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  tags: [install]

- name: Install Docker apt signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  tags: [install]

- name: Configure Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    signed_by: /etc/apt/keyrings/docker.asc
  tags: [install]

- name: Remove legacy Docker apt source list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  tags: [install]

- name: Install Docker CE
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    state: present
    update_cache: true
  tags: [install]

- name: Deploy Docker daemon configuration
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker
  tags: [config]

# Restart Docker now if daemon.json changed — the compose stacks started by
# the compose_stack role depend on the new configuration being active. Without
# this flush the handler would fire at end of play, AFTER the stacks started.
- name: Flush handlers so daemon config applies before stacks start
  ansible.builtin.meta: flush_handlers
  tags: [always]

# Docker with ip6tables enables IPv6 forwarding, which disables SLAAC RA
# acceptance. Set accept_ra=2 to accept RAs even with forwarding enabled.
- name: Deploy IPv6 RA sysctl drop-in
  ansible.builtin.import_role:
    name: common
    tasks_from: sysctl_dropin
  vars:
    sysctl_dropin_file: /etc/sysctl.d/99-docker-ra.conf
    sysctl_dropin_content: |
      net.ipv6.conf.all.accept_ra=2
      net.ipv6.conf.eth0.accept_ra=2

- name: Re-apply sysctl on boot
  ansible.builtin.import_role:
    name: common
    tasks_from: sysctl_reboot_cron
  vars:
    sysctl_cron_name: sysctl-accept-ra
    sysctl_cron_file: /etc/sysctl.d/99-docker-ra.conf
    sysctl_cron_extra: /usr/bin/rdisc6 -1 eth0

- name: Weekly Docker image cleanup
  ansible.builtin.cron:
    name: docker-image-prune
    weekday: "0"
    hour: "3"
    minute: "0"
    job: docker image prune -af --filter 'until=360h' > /dev/null 2>&1
  tags: [config]

- name: Enable Docker service
  ansible.builtin.import_role:
    name: common
    tasks_from: systemd_enable
  vars:
    systemd_unit: docker

- name: Verify Docker is healthy
  ansible.builtin.command: docker info
  register: docker_check
  changed_when: false
  tags: [validate]
