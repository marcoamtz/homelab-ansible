---
# Stack definitions consumed by tasks/main.yml. Each entry:
#   name        stack name (label only)
#   dir         directory holding compose.yml
#   template    role template rendered to <dir>/compose.yml
#   config_dir  optional bind-mounted config dir, created with owner/group
#   owner/group ownership for config_dir
#   extra_dirs  optional additional dirs (path + optional owner/group)
#   extra_files optional downloaded files (url + dest + optional checksum/owner/group)
#   health_url  optional endpoint checked after startup
#   health_retries optional retry override for slower-starting services
# Per-stack settings come from the service variables in group_vars; override
# this list there to add or remove stacks.
compose_health_wait_timeout: 180

compose_stacks:
  - name: dockge
    dir: "{{ dockge_data_dir }}"
    template: dockge/compose.yml.j2
    health_url: "http://localhost:{{ dockge_port }}"
    extra_dirs:
      - path: "{{ dockge_stacks_dir }}"
  - name: jellyfin
    dir: "{{ dockge_stacks_dir }}/jellyfin"
    template: jellyfin/compose.yml.j2
    health_url: "http://localhost:{{ jellyfin_port_http }}/health"
    health_retries: 12
    config_dir: "{{ jellyfin_config_dir }}"
    owner: "{{ jellyfin_uid }}"
    group: "{{ jellyfin_gid }}"
    extra_dirs:
      - path: "{{ jellyfin_cache_dir }}"
        owner: "{{ jellyfin_uid }}"
        group: "{{ jellyfin_gid }}"
      - path: "{{ jellyfin_transcode_dir }}"
        owner: "{{ jellyfin_uid }}"
        group: "{{ jellyfin_gid }}"
      - path: "{{ jellyfin_fonts_dir }}"
        owner: "{{ jellyfin_uid }}"
        group: "{{ jellyfin_gid }}"
    extra_files:
      # Subtitle fallback font (Dashboard -> Playback -> Transcoding sets
      # the fallback font path to /config/fonts)
      - url: "{{ jellyfin_cjk_font_url }}"
        dest: "{{ jellyfin_fonts_dir }}/NotoSansCJK-Regular.ttc"
        checksum: "{{ jellyfin_cjk_font_checksum }}"
        owner: "{{ jellyfin_uid }}"
        group: "{{ jellyfin_gid }}"
  - name: speedtest-tracker
    dir: "{{ dockge_stacks_dir }}/speedtest-tracker"
    template: speedtest-tracker/compose.yml.j2
    health_url: "http://localhost:{{ speedtest_port }}/api/healthcheck"
    health_retries: 12
    config_dir: "{{ speedtest_config_dir }}"
    owner: "{{ speedtest_puid }}"
    group: "{{ speedtest_pgid }}"
  - name: qbittorrent
    dir: "{{ dockge_stacks_dir }}/qbittorrent"
    template: qbittorrent/compose.yml.j2
    health_url: "http://localhost:{{ qbittorrent_port_webui }}/"
    health_retries: 6
    config_dir: "{{ qbittorrent_config_dir }}"
    owner: "{{ qbittorrent_puid }}"
    group: "{{ qbittorrent_pgid }}"
    extra_dirs:
      - path: "{{ qbittorrent_incomplete_dir }}"
        owner: "{{ qbittorrent_puid }}"
        group: "{{ qbittorrent_pgid }}"
