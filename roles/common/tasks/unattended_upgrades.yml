---
# Shared via import_role tasks_from (also used by proxmox_host).
# Daily security updates from the Debian security archive only. Third-party
# repos (Docker, NextDNS, Tailscale, Proxmox) and point releases stay with
# update-all.yml, so a Docker or containerd upgrade never restarts stacks
# unattended. No reboots: LXC containers share the host kernel.
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  tags: [install, unattended]

- name: Enable daily unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      // Managed by Ansible.
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  tags: [config, unattended]

# #clear drops the stock origins from 50unattended-upgrades, so the list
# below is the complete set of allowed sources.
- name: Limit unattended upgrades to Debian security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    owner: root
    group: root
    mode: "0644"
    content: |
      // Managed by Ansible.
      #clear Unattended-Upgrade::Origins-Pattern;
      Unattended-Upgrade::Origins-Pattern {
        "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
  tags: [config, unattended]

# A dry run still downloads pending upgrades, so point APT's archive cache at a
# throwaway directory; otherwise the .debs land in /var/cache/apt/archives and
# the apt cache cleanup reports a change on every run until they install.
- name: Verify unattended-upgrades only allows the security archive
  check_mode: false
  tags: [validate, unattended]
  block:
    - name: Create scratch APT archive directory for the dry run
      ansible.builtin.tempfile:
        state: directory
        suffix: .unattended-dry-run
      register: common_unattended_scratch
      changed_when: false

    - name: Create scratch APT partial download directory
      ansible.builtin.file:
        path: "{{ common_unattended_scratch.path }}/partial"
        state: directory
        owner: _apt
        group: root
        mode: "0700"
      changed_when: false

    - name: Write scratch APT config for the dry run
      ansible.builtin.copy:
        dest: "{{ common_unattended_scratch.path }}/apt.conf"
        mode: "0644"
        content: |
          Dir::Cache::archives "{{ common_unattended_scratch.path }}/";
      changed_when: false

    - name: Dry-run unattended-upgrades and check allowed origins
      ansible.builtin.command: unattended-upgrade --dry-run --debug
      environment:
        APT_CONFIG: "{{ common_unattended_scratch.path }}/apt.conf"
      register: common_unattended_dry_run
      changed_when: false
      failed_when: >-
        common_unattended_dry_run.rc != 0 or
        (common_unattended_dry_run.stdout ~ common_unattended_dry_run.stderr)
        is not search('Allowed origins are: origin=Debian,codename=\S+-security,label=Debian-Security\s*$', multiline=True)
  always:
    - name: Remove scratch APT archive directory
      ansible.builtin.file:
        path: "{{ common_unattended_scratch.path }}"
        state: absent
      when: common_unattended_scratch.path is defined
      changed_when: false
