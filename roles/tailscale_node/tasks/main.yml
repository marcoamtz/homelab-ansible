---
- name: Install Tailscale
  ansible.builtin.import_role:
    name: common
    tasks_from: apt_repository
  vars:
    apt_repo_name: tailscale
    apt_repo_key_url: https://pkgs.tailscale.com/stable/debian/{{ ansible_facts['distribution_release'] }}.noarmor.gpg
    apt_repo_uri: https://pkgs.tailscale.com/stable/debian
    apt_repo_suites: "{{ ansible_facts['distribution_release'] }}"
    apt_repo_components: main
    apt_repo_packages: [tailscale]

- name: Deploy forwarding sysctl drop-in
  ansible.builtin.import_role:
    name: common
    tasks_from: sysctl_dropin
  vars:
    sysctl_dropin_file: /etc/sysctl.d/99-tailscale.conf
    sysctl_dropin_content: |
      net.ipv4.ip_forward=1
      net.ipv6.conf.all.forwarding=1
      net.ipv6.conf.all.accept_ra=2
      net.ipv6.conf.{{ tailscale_interface }}.accept_ra=2

# Also re-add the static ULA: Proxmox regenerates the container network from
# its CT config (ip6=auto) on restart, so the runtime-assigned ULA below
# would otherwise vanish until the next playbook run, breaking the advertised
# IPv6 subnet route.
- name: Re-apply forwarding and ULA on boot
  ansible.builtin.import_role:
    name: common
    tasks_from: boot_oneshot
  vars:
    boot_oneshot_name: sysctl-forwarding
    boot_oneshot_commands:
      - /sbin/sysctl -p /etc/sysctl.d/99-tailscale.conf
      # `-`: "File exists" when the address survived is fine
      - "-/sbin/ip -6 addr add {{ ula_address }} dev {{ tailscale_interface }}"
      - /usr/bin/rdisc6 -1 {{ tailscale_interface }}

# Proxmox ip6=auto handles GUA via SLAAC; add static ULA here so both coexist.
- name: Assign static ULA address
  ansible.builtin.command: ip -6 addr add {{ ula_address }} dev {{ tailscale_interface }}
  register: ula_result
  changed_when: >
    ula_result.rc == 0 and
    'RTNETLINK answers: File exists' not in ula_result.stderr and
    'address already assigned' not in ula_result.stderr
  failed_when: >
    ula_result.rc != 0 and
    'RTNETLINK answers: File exists' not in ula_result.stderr and
    'address already assigned' not in ula_result.stderr
  tags: [config]

- name: Enable Tailscale service
  ansible.builtin.import_role:
    name: common
    tasks_from: systemd_enable
  vars:
    systemd_unit: tailscaled

- name: Check Tailscale status
  ansible.builtin.command: tailscale status
  register: ts_status
  changed_when: false
  failed_when: false
  tags: [service]

- name: Authenticate Tailscale
  ansible.builtin.command: tailscale up --authkey={{ tailscale_auth_key }}
  when: ts_status.rc != 0
  changed_when: true
  no_log: true
  tags: [service]

- name: Apply Tailscale settings
  ansible.builtin.command: tailscale set {{ tailscale_args }}
  changed_when: false
  tags: [service]

- name: Verify Tailscale IPv4 connectivity
  ansible.builtin.command: tailscale ip -4
  register: ts_ip4
  changed_when: false
  tags: [validate]

- name: Verify Tailscale IPv6 connectivity
  ansible.builtin.command: tailscale ip -6
  register: ts_ip6
  changed_when: false
  tags: [validate]
