---
- name: Reload systemd
  ansible.builtin.command: systemctl daemon-reload
  changed_when: false

- name: Restart nextdns
  ansible.builtin.command: systemctl restart nextdns
  changed_when: true

- name: Validate dnsmasq configuration
  ansible.builtin.command: dnsmasq --test
  changed_when: false
  listen: Restart dnsmasq

- name: Restart dnsmasq
  ansible.builtin.command: systemctl restart dnsmasq
  changed_when: true
