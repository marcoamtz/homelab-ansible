---
- name: Assert ipv6_prefix covers exactly a /64
  ansible.builtin.assert:
    that: ipv6_prefix.split(':') | length == 4
    fail_msg: >-
      ipv6_prefix must be the first 4 hextets of a /64 (e.g. 'fd00:0:0:1') —
      the reverse-zone derivation in 06-rfc6761.conf.j2 assumes it
    quiet: true
  tags: [always]

# Config first: the package's postinst runs `nextdns install`, which installs
# and starts the service with whatever /etc/nextdns.conf holds.
- name: Deploy NextDNS configuration
  ansible.builtin.template:
    src: nextdns.conf.j2
    dest: /etc/nextdns.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart nextdns
  tags: [config]

- name: Install NextDNS
  ansible.builtin.import_role:
    name: common
    tasks_from: apt_repository
  vars:
    apt_repo_name: nextdns
    apt_repo_key_url: https://repo.nextdns.io/nextdns.gpg
    apt_repo_uri: https://repo.nextdns.io/deb
    apt_repo_suites: stable
    apt_repo_components: main
    apt_repo_packages: [nextdns]

- name: Ensure dnsmasq.d directory exists
  ansible.builtin.file:
    path: /etc/dnsmasq.d
    state: directory
    mode: "0755"
  tags: [config]

# validate: a fragment with a syntax error never replaces the live file.
- name: Deploy dnsmasq configurations
  ansible.builtin.template:
    src: "dnsmasq.d/{{ item }}.j2"
    dest: "/etc/dnsmasq.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
    validate: dnsmasq --test --conf-file=%s
  loop: "{{ dnsmasq_configs }}"
  notify: Restart dnsmasq
  tags: [config]

- name: Find unmanaged dnsmasq configs
  ansible.builtin.find:
    paths: /etc/dnsmasq.d
    patterns: "*.conf"
  register: existing_configs
  tags: [config]

- name: Remove stale dnsmasq configs
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ existing_configs.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: item.path | basename not in dnsmasq_configs
  notify: Restart dnsmasq
  tags: [config]

# All fragments together, as the service loads them. The unit runs the same
# check itself, but only after the old process has stopped, so a config that
# fails there takes DNS down. --conf-dir is explicit: Debian passes the
# directory through /etc/default/dnsmasq, so a bare `dnsmasq --test` only
# reads the empty /etc/dnsmasq.conf. A task, not a handler: a failed handler
# is not notified again on the next run, which would leave the bad config
# waiting for the next restart.
- name: Validate complete dnsmasq configuration
  ansible.builtin.command: dnsmasq --test --conf-dir=/etc/dnsmasq.d,*.conf
  changed_when: false
  tags: [config]

- name: Fix LXC resolv.conf and prevent Proxmox overwrite
  ansible.builtin.copy:
    content: "nameserver 127.0.0.1\n"
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"
  tags: [config]

- name: Create Proxmox resolv.conf ignore marker
  ansible.builtin.copy:
    content: ""
    dest: /etc/.pve-ignore.resolv.conf
    mode: "0644"
    force: false
  tags: [config]

- name: Enable NextDNS service
  ansible.builtin.import_role:
    name: common
    tasks_from: systemd_enable
  vars:
    systemd_unit: nextdns

- name: Enable dnsmasq service
  ansible.builtin.import_role:
    name: common
    tasks_from: systemd_enable
  vars:
    systemd_unit: dnsmasq

# Restart now: handlers otherwise run at the end of the play, and the check
# below would test the processes still running the old configuration.
- name: Flush handlers so the DNS check runs against the new config
  ansible.builtin.meta: flush_handlers
  tags: [always]

- name: Verify DNS resolution works
  ansible.builtin.command: dig +short +time=5 google.com @127.0.0.1
  register: dns_check
  changed_when: false
  check_mode: false  # read-only; a skipped dig has no answer for `until`
  # dig exits 0 on SERVFAIL/NXDOMAIN; only an answer counts. Retried: the
  # services may have just restarted.
  until: dns_check.rc == 0 and dns_check.stdout | length > 0
  retries: 6
  delay: 5
  tags: [validate]
