---
- name: Assert target is a Debian-family system
  ansible.builtin.import_role:
    name: common
    tasks_from: assert_debian

- name: Harden SSH
  ansible.builtin.import_role:
    name: common
    tasks_from: sshd

# --- Mail relay ---
# Proxmox notifications (vzdump, zed, smartd) go out through the local
# Postfix. Direct delivery to port 25 is ISP-blocked, so relay through the
# shared mail_* SMTP account.
- name: Install Postfix SASL support
  ansible.builtin.apt:
    name: libsasl2-modules
    state: present
  tags: [install]

- name: Configure Postfix relay
  ansible.builtin.lineinfile:
    path: /etc/postfix/main.cf
    regexp: "^{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
  loop: "{{ proxmox_postfix_relay | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  notify: Reload postfix
  tags: [config]

- name: Deploy Postfix relay credentials
  ansible.builtin.copy:
    dest: /etc/postfix/sasl_passwd
    owner: root
    group: root
    mode: "0600"
    content: "[{{ mail_host }}]:{{ mail_port }} {{ mail_username }}:{{ mail_password }}\n"
  no_log: true
  notify: Rebuild Postfix credentials map
  tags: [config]

# The built-in matcher mails every notification, including "backup
# successful". Only mail what needs attention. `unknown` is what mail to root
# (zed, smartd, cron) gets when proxmox-mail-forward relays it.
- name: Read default notification matcher
  ansible.builtin.command: pvesh get /cluster/notifications/matchers/default-matcher --output-format json
  register: proxmox_notify_matcher
  changed_when: false
  check_mode: false
  tags: [config]

- name: Mail only warnings, errors and forwarded root mail
  ansible.builtin.command: pvesh set /cluster/notifications/matchers/default-matcher --match-severity warning,error,unknown
  when: >-
    (proxmox_notify_matcher.stdout | from_json)['match-severity'] | default([])
    | join(',') != 'warning,error,unknown'
  changed_when: true
  tags: [config]

# GPU passthrough uses Proxmox `devN` entries (proxmox_lxcs), which create
# the device inside the CT with the right group. The world-writable rule
# that used to grant access is removed so udev restores 0660 root:render.
- name: Remove world-writable GPU udev rule
  ansible.builtin.file:
    path: /etc/udev/rules.d/99-gpu-passthrough.rules
    state: absent
  notify: Reload udev rules
  tags: [config]

- name: Enable weekly TRIM for OS drive
  ansible.builtin.import_role:
    name: common
    tasks_from: systemd_enable
  vars:
    systemd_unit: fstrim.timer

- name: Enable weekly TRIM for ZFS pool
  ansible.builtin.import_role:
    name: common
    tasks_from: systemd_enable
  vars:
    systemd_unit: "zfs-trim-weekly@{{ zfs_trim_pool }}.timer"

# --- LXC pre-start NFS wait ---
- name: Ensure Proxmox snippets directory exists
  ansible.builtin.file:
    path: /var/lib/vz/snippets
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [config]

- name: Deploy LXC pre-start NFS wait hook
  ansible.builtin.template:
    src: wait-for-nfs.sh.j2
    dest: /var/lib/vz/snippets/wait-for-nfs.sh
    owner: root
    group: root
    mode: "0755"
  tags: [config]

- name: Read LXC configs for hookscript
  ansible.builtin.command: pct config {{ item.key }}
  loop: "{{ lxc_pre_start_nfs_waits | dict2items }}"
  loop_control:
    label: "CT {{ item.key }}"
  register: pct_config_result
  changed_when: false
  check_mode: false
  tags: [config]

- name: Wire pre-start NFS wait hook on LXCs
  ansible.builtin.command: "pct set {{ item.item.key }} --hookscript local:snippets/wait-for-nfs.sh"
  loop: "{{ pct_config_result.results }}"
  loop_control:
    label: "CT {{ item.item.key }}"
  when: "'hookscript: local:snippets/wait-for-nfs.sh' not in item.stdout_lines"
  changed_when: true
  tags: [config]
