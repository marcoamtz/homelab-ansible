---
- name: Assert target is a Debian-family system
  ansible.builtin.import_role:
    name: common
    tasks_from: assert_debian

# GPU passthrough for unprivileged LXC containers requires world-readable
# /dev/dri devices. Without this, the UID mapping makes the render device
# inaccessible inside the container.
- name: Deploy GPU passthrough udev rule
  ansible.builtin.copy:
    content: 'SUBSYSTEM=="drm", MODE="0666"'
    dest: /etc/udev/rules.d/99-gpu-passthrough.rules
    owner: root
    group: root
    mode: "0644"
  notify: Reload udev rules
  tags: [config]

- name: Check for GPU render device
  ansible.builtin.stat:
    path: /dev/dri/renderD128
  register: gpu_render_device
  tags: [always]

- name: Set GPU device permissions
  ansible.builtin.file:
    path: /dev/dri/renderD128
    mode: "0666"
  when: gpu_render_device.stat.exists
  tags: [config]

- name: Enable weekly TRIM for OS drive
  ansible.builtin.import_role:
    name: common
    tasks_from: systemd_enable
  vars:
    systemd_unit: fstrim.timer

- name: Enable weekly TRIM for ZFS pool
  ansible.builtin.import_role:
    name: common
    tasks_from: systemd_enable
  vars:
    systemd_unit: "zfs-trim-weekly@{{ zfs_trim_pool }}.timer"

# --- LXC pre-start NFS wait ---
- name: Ensure Proxmox snippets directory exists
  ansible.builtin.file:
    path: /var/lib/vz/snippets
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [config]

- name: Deploy LXC pre-start NFS wait hook
  ansible.builtin.template:
    src: wait-for-nfs.sh.j2
    dest: /var/lib/vz/snippets/wait-for-nfs.sh
    owner: root
    group: root
    mode: "0755"
  tags: [config]

- name: Wire pre-start NFS wait hook on LXCs
  ansible.builtin.command: "pct set {{ item.key }} --hookscript local:snippets/wait-for-nfs.sh"
  loop: "{{ lxc_pre_start_nfs_waits | dict2items }}"
  loop_control:
    label: "CT {{ item.key }}"
  register: pct_hookscript_result
  changed_when: false  # pct set is config-level idempotent; no diff signal
  tags: [config]

- name: Re-check GPU device permissions
  ansible.builtin.stat:
    path: /dev/dri/renderD128
  register: gpu_render_device_after
  when: gpu_render_device.stat.exists
  tags: [validate]

- name: Verify GPU device is world-readable
  ansible.builtin.assert:
    that: gpu_render_device_after.stat.mode == "0666"
    fail_msg: "/dev/dri/renderD128 is not 0666 — Jellyfin hardware transcoding will fail inside the LXC"
    quiet: true
  when: gpu_render_device.stat.exists
  tags: [validate]
