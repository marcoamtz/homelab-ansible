---
# ZFS pool that gets the weekly TRIM timer.
zfs_trim_pool: tank

# ZFS ARC size cap in bytes, written to /etc/modprobe.d/zfs.conf (the whole
# file) and applied to the running system. Empty = unmanaged.
zfs_arc_max: ""

# Weekly archive of /etc, including /etc/pve: host config (storage, backup
# jobs, firewall, notifications) is in no vzdump backup. Must be a
# subdirectory of a storage mount that survives the host, e.g.
# /mnt/pve/<backup-storage>/host-config. Empty = not installed.
proxmox_host_config_backup_dir: ""
# Archives kept; older ones are deleted.
proxmox_host_config_backup_keep: 8

# Postfix main.cf settings for relaying host mail via the shared mail_* SMTP
# account. Port 465 is implicit TLS (wrapper mode); 587 uses STARTTLS. IPv4
# first: the host has no IPv6 route to the internet.
proxmox_postfix_relay:
  relayhost: "[{{ mail_host }}]:{{ mail_port }}"
  smtp_tls_wrappermode: "{{ 'yes' if mail_port | string == '465' else 'no' }}"
  # secure = verify the certificate matches the relay host; encrypt alone
  # would hand the SASL password to anyone able to intercept the connection
  smtp_tls_security_level: secure
  smtp_tls_CAfile: /etc/ssl/certs/ca-certificates.crt
  smtp_sasl_auth_enable: "yes"
  smtp_sasl_password_maps: hash:/etc/postfix/sasl_passwd
  smtp_sasl_security_options: noanonymous
  smtp_address_preference: ipv4
